server {
    listen 8082 ssl;
    server_name _;

    ssl_certificate /etc/ssl/certs/self.crt;
    ssl_certificate_key /etc/ssl/private/self.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    auth_basic "Counselor - 请输入密码";
    auth_basic_user_file /etc/nginx/.htpasswd;
    limit_req zone=login burst=10 nodelay;

    root /var/www/counselor;
    index index.html;

    # 登录端点 - 严格速率限制
    location = /api/auto-login {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        auth_basic off;
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
    }

    # API 代理 - Bearer token 认证由 server.py 处理
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        auth_basic off;
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /data/ { deny all; return 403; }
    location ~ /\. { deny all; }
    location ~ \.env$ { deny all; }
    location ~ \.py$ { deny all; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
